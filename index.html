<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>À la pêche aux phish</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<script src="i18n.js"></script>
<script src="user.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root{--txt:#202124;--sub:#5f6368;--zoom:1;}
html.size-large{--zoom:1.25;}
html{zoom:var(--zoom);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Roboto',Arial,sans-serif;color:var(--txt);background:#fff;overflow:hidden;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
.material-icon{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:22px;line-height:1;color:#5f6368;-webkit-font-smoothing:antialiased;user-select:none;}

/* ---------- Header ---------- */
header{height:64px;display:flex;align-items:center;padding:0 16px;position:relative;z-index:10;}
.hleft{display:flex;align-items:center;min-width:200px;gap:8px;}
.icon-btn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:rgba(60,64,67,.08);}
.logo{display:flex;align-items:center;gap:4px;padding-left:4px;}
.logo img{height:56px;width:56px;object-fit:contain;}
.hsearch{flex:0 1 720px;margin:0 8px;}
.searchbox{display:flex;align-items:center;background:#eaf1fb;border-radius:8px;height:48px;padding:0 4px 0 8px;}
.searchbox:focus-within{background:#fff;box-shadow:0 1px 1px 0 rgba(65,69,73,.3),0 1px 3px 1px rgba(65,69,73,.15);}
.searchbox input{flex:1;border:none;outline:none;background:transparent;font-size:16px;color:#202124;padding:0 8px;}
.searchbox .icon-btn{width:44px;height:44px;}
.hright{margin-left:auto;display:flex;align-items:center;gap:4px;}
.avatar-top{width:36px;height:36px;border-radius:50%;background:#e8a33d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;margin-left:8px;cursor:pointer;}
.avatar-top:hover{box-shadow:0 0 0 4px rgba(60,64,67,.12);}

/* ---------- Body layout ---------- */
.app{display:flex;height:calc(100vh / var(--zoom,1) - 64px);}
.sidebar{width:256px;padding:8px 0 0 8px;flex-shrink:0;overflow-y:auto;}
.compose{display:flex;align-items:center;gap:16px;height:56px;border-radius:16px;padding:0 24px 0 16px;box-shadow:0 1px 3px 1px rgba(60,64,67,.15),0 1px 2px 0 rgba(60,64,67,.3);margin:0 12px 16px 0;background:#c2e7ff;color:#001d35;font-family:'Google Sans';font-size:14px;font-weight:500;}
.compose:hover{box-shadow:0 1px 3px 1px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);background:#c7e9ff;}
.compose svg{width:24px;height:24px;}
.nav-item{display:flex;align-items:center;gap:18px;height:32px;padding:0 12px 0 26px;border-radius:0 16px 16px 0;margin-right:8px;font-family:'Google Sans';font-size:14px;color:#202124;font-weight:500;}
.nav-item:hover{background:#eaeef6;}
.nav-item.active{background:#d3e3fd;color:#041e49;font-weight:700;}
.nav-item .material-icon{font-size:20px;}
.nav-item .count{margin-left:auto;font-size:12px;color:#5f6368;font-weight:400;}
.nav-item.active .count{color:#041e49;}

/* ---------- Content ---------- */
.content{flex:1;background:#f6f8fc;border-radius:16px 0 0 0;overflow:hidden;display:flex;flex-direction:column;}
.toolbar{height:48px;display:flex;align-items:center;padding:0 16px;gap:6px;flex-shrink:0;}
.toolbar .tb-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.toolbar .tb-icon:hover{background:rgba(32,33,36,.06);}
.toolbar .greet{margin-left:8px;font-size:13px;color:#3c4043;font-family:'Google Sans';}
.toolbar .greet b{color:#202124;}
.toolbar .greet a{color:#0b57d0;text-decoration:none;cursor:pointer;margin-left:8px;}
.toolbar .greet a:hover{text-decoration:underline;}
.toolbar .pager{margin-left:auto;color:#5f6368;font-size:13px;}

.maillist{flex:1;overflow-y:auto;background:#fff;border-radius:16px 16px 0 0;padding-bottom:24px;}

/* Level rows : vraie ligne Gmail (compacte, une ligne) */
.mailrow{display:flex;align-items:center;height:40px;padding:0 16px 0 8px;border-bottom:1px solid #f1f3f4;cursor:pointer;font-size:14px;}
.mailrow:hover{box-shadow:inset 1px 0 0 #dadce0,inset -1px 0 0 #dadce0,0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);z-index:1;}
.mailrow.unread .m-sender,.mailrow.unread .m-subject{color:#202124;font-weight:700;}
.mailrow:not(.unread) .m-sender,.mailrow:not(.unread) .m-subject{color:#5f6368;font-weight:400;}
.m-cb,.m-star{width:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.m-star .material-icon{font-size:20px;color:#c5c9cf;}      /* pas fait */
.m-star.ok .material-icon{color:#f9ab00;}                  /* réussi avec des erreurs */
.m-star.perfect .material-icon{color:#34a853;}             /* réussi parfaitement */
.m-cb input{width:16px;height:16px;}
.m-sender{width:180px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:12px;}
.m-body{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:16px;}
.m-subject{color:#202124;}
.m-snippet{color:#5f6368;font-weight:400;}
.m-label{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:500;margin-right:8px;vertical-align:middle;color:#fff;}

/* Section label between tutorial and levels */
.list-section{font-family:'Google Sans';font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#5f6368;padding:16px 20px 6px;}

/* Footer inside list */
.list-footer{flex-shrink:0;padding:14px 20px 16px;text-align:center;font-size:13px;color:#9aa0a6;}
.list-footer .contact{margin-top:10px;font-family:'Google Sans';}
.list-footer .contact a{color:#0b57d0;text-decoration:none;}
.list-footer .contact a:hover{text-decoration:underline;}
.list-footer .contact .sep{color:#c5c9cf;}

/* ---------- Onboarding modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(32,33,36,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-bg.show{display:flex;}
.modal{width:min(94vw,440px);background:#fff;border-radius:28px;padding:36px 32px;box-shadow:0 10px 40px rgba(0,0,0,.3);}
.modal .m-logo{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 12px;}
.modal h2{font-family:'Google Sans';font-size:22px;font-weight:700;text-align:center;margin-bottom:6px;}
.modal .m-sub{font-size:14px;color:#5f6368;text-align:center;line-height:1.5;margin-bottom:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:500;color:#5f6368;margin-bottom:6px;font-family:'Google Sans';}
.field input{width:100%;height:46px;border:1px solid #dadce0;border-radius:10px;padding:0 14px;font-size:15px;color:#202124;outline:none;}
.field input:focus{border-color:#0b57d0;box-shadow:0 0 0 1px #0b57d0;}
.modal .start-btn{width:100%;height:48px;border-radius:24px;background:#0b57d0;color:#fff;font-family:'Google Sans';font-size:15px;font-weight:500;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;}
.modal .start-btn:hover{background:#0a4fbd;}
.modal .start-btn .material-icon{color:#fff;}
.privacy{display:flex;gap:8px;align-items:flex-start;background:#e6f4ea;border-radius:12px;padding:12px 14px;margin-top:20px;font-size:12.5px;line-height:1.5;color:#1e4620;}
.privacy .material-icon{color:#188038;font-size:18px;flex-shrink:0;margin-top:1px;}
.size-test{display:flex;flex-direction:column;gap:16px;margin:8px 0;}
.size-choice{text-align:left;background:#fff;border:2px solid #dadce0;border-radius:16px;padding:22px 24px;cursor:pointer;transition:border-color .12s,box-shadow .12s,background .12s;}
.size-choice:hover{border-color:#0b57d0;background:#f6faff;box-shadow:0 2px 10px rgba(11,87,208,.12);}
.size-sample{color:#202124;margin-bottom:10px;}
.size-tag{display:inline-flex;align-items:center;gap:6px;font-family:'Google Sans';font-size:14px;font-weight:700;color:#0b57d0;}
.size-tag::before{content:"›";font-size:18px;}
.lang-switch{display:block;width:100%;margin-top:18px;padding:12px 14px;border-radius:12px;border:1px solid #dadce0;background:#fff;font-family:'Google Sans';font-size:14px;font-weight:500;color:#0b57d0;text-align:center;}
.lang-switch:hover{background:#f6faff;border-color:#0b57d0;}
.link-back{display:inline-flex;align-items:center;gap:4px;margin-top:10px;color:#5f6368;font-family:'Google Sans';font-size:14px;cursor:pointer;}
.link-back:hover{color:#202124;}

/* ===================== Affichage mobile (<= 768px) =====================
   Le bandeau lateral facon Gmail devient un tiroir : sinon il mange les deux
   tiers d'un ecran de telephone. Les lignes de la liste passent sur deux
   lignes, et l'en-tete se resserre. */
@media(max-width:768px){
  header{height:56px;padding:0 4px;}
  .hleft{min-width:0;gap:0;}
  .logo{padding-left:0;}
  .logo img{height:40px;width:40px;}
  .icon-btn{width:42px;height:42px;}
  .hsearch{flex:1 1 auto;margin:0 4px;}
  .searchbox{height:40px;}
  .searchbox input{font-size:14px;padding:0 4px;}
  .searchbox .icon-btn:last-child{display:none;}
  .hright{gap:0;}
  .hright .icon-btn{display:none;}

  .app{height:calc(100vh / var(--zoom,1) - 56px);}
  /* tiroir : on decale avec « left » et non « transform », pour ne pas piéger
     les elements en position fixed qu'il contient. */
  .sidebar{position:fixed;top:56px;bottom:0;left:-300px;width:280px;background:#fff;
           z-index:40;box-shadow:2px 0 14px rgba(0,0,0,.28);transition:left .22s ease;
           padding:12px 0 0 8px;}
  .sidebar.open{left:0;}
  .scrim{display:none;position:fixed;inset:56px 0 0 0;background:rgba(32,33,36,.45);z-index:35;}
  .scrim.show{display:block;}
  .content{border-radius:0;}

  .toolbar{padding:0 6px;}
  .toolbar .pager{display:none;}
  .toolbar .greet{margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* lignes de liste sur deux niveaux */
  .mailrow{height:auto;min-height:58px;align-items:center;flex-wrap:wrap;
           padding:9px 12px;row-gap:2px;}
  .m-cb{display:none;}
  .m-star{width:30px;}
  .m-sender{width:auto;flex:1 1 auto;padding-right:8px;}
  .m-body{flex:0 0 100%;white-space:normal;padding-right:0;overflow:visible;
          text-overflow:clip;line-height:1.4;}
  .list-section{padding:14px 14px 4px;}
  .list-footer{padding:12px 14px 14px;}
}
</style>
</head>
<body>
<header>
  <div class="hleft">
    <button class="icon-btn" onclick="toggleNav()" aria-label="Menu"><span class="material-icon">menu</span></button>
    <div class="logo"><img src="assets/logo.png" alt="À la pêche aux phish"></div>
  </div>
  <div class="hsearch">
    <div class="searchbox">
      <button class="icon-btn"><span class="material-icon">search</span></button>
      <input id="search" data-i18n-ph="searchLevels" oninput="onSearch(this.value)">
      <button class="icon-btn"><span class="material-icon">tune</span></button>
    </div>
  </div>
  <div class="hright">
    <button class="icon-btn"><span class="material-icon">help</span></button>
    <button class="icon-btn"><span class="material-icon">settings</span></button>
    <button class="icon-btn"><span class="material-icon">apps</span></button>
    <div class="avatar-top" id="avatarTop" data-i18n-title="navProfile" onclick="editUser()">L</div>
  </div>
</header>

<div class="app">
  <div class="scrim" id="scrim" onclick="toggleNav(false)"></div>
  <aside class="sidebar" id="sidebar">
    <button class="compose" onclick="editUser()">
      <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 000-1.41l-2.34-2.34a.996.996 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      <span data-i18n="navProfile">Mon profil</span>
    </button>
    <div class="nav-item filter active" onclick="setFilter('all',this)"><span class="material-icon">inbox</span><span data-i18n="navLevels">Niveaux</span><span class="count" id="lvlCount">0</span></div>
    <div class="nav-item filter" onclick="setFilter('done',this)"><span class="material-icon">star</span><span data-i18n="navDone">Terminés</span><span class="count" id="doneCount">0</span></div>
    <div class="nav-item filter" onclick="setFilter('todo',this)"><span class="material-icon">radio_button_unchecked</span><span data-i18n="navTodo">À faire</span></div>
    <div class="nav-item" onclick="location.href='inbox.html?tuto=1'"><span class="material-icon">school</span><span data-i18n="navTutorial">Tutoriel</span></div>
  </aside>

  <main class="content">
    <div class="toolbar">
      <button class="tb-icon"><span class="material-icon" style="font-size:20px;">check_box_outline_blank</span></button>
      <button class="tb-icon"><span class="material-icon">refresh</span></button>
      <span class="greet" id="greet"></span>
      <div class="pager" id="pager"></div>
    </div>
    <div class="maillist" id="maillist"></div>
    <div class="list-footer">
      <span data-i18n="footerText"></span>
      <div class="contact">
        <a href="https://lattice-walker.github.io/CipherOps/index.html">Blog</a>
        <span class="sep">&nbsp;·&nbsp;</span>
        <a href="https://lattice-walker.github.io/CipherOps/contact/contact.html">Contact</a>
        <span class="sep">&nbsp;·&nbsp;</span>
        <a href="https://github.com/Lattice-Walker/A-la-peche-aux-phish" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </main>
</div>

<!-- Onboarding : étape 1 (identité) puis étape 2 (test de lisibilité) -->
<div class="modal-bg" id="onboard">
  <div class="modal">
    <div id="step1">
      <img class="m-logo" src="assets/logo.png" alt="">
      <h2 data-i18n="onbTitle"></h2>
      <div class="m-sub" data-i18n="onbSub"></div>
      <form id="onboardForm" autocomplete="off">
        <div class="field"><label for="f-prenom" data-i18n="onbFirst"></label><input id="f-prenom" required maxlength="40" data-i18n-ph="onbFirstPh"></div>
        <div class="field"><label for="f-nom" data-i18n="onbLast"></label><input id="f-nom" required maxlength="40" data-i18n-ph="onbLastPh"></div>
        <div class="field"><label for="f-entreprise" data-i18n="onbCompany"></label><input id="f-entreprise" required maxlength="60" data-i18n-ph="onbCompanyPh"></div>
        <button type="submit" class="start-btn"><span class="material-icon" style="font-size:18px;">arrow_forward</span><span data-i18n="onbContinue"></span></button>
      </form>
      <div class="privacy">
        <span class="material-icon">lock</span>
        <span><b data-i18n="onbPrivacyTitle"></b> <span data-i18n="onbPrivacyBody"></span></span>
      </div>
      <button type="button" class="lang-switch" data-i18n="langSwitch" onclick="toggleLang()"></button>
    </div>
    <div id="step2" style="display:none;">
      <h2 data-i18n="sizeTitle"></h2>
      <div class="m-sub" data-i18n="sizeSub"></div>
      <div class="size-test">
        <button type="button" class="size-choice" onclick="chooseSize('normal')">
          <div class="size-sample" style="font-size:16px;line-height:1.5;" data-i18n="sizeSample"></div>
          <div class="size-tag" data-i18n="sizeNormal"></div>
        </button>
        <button type="button" class="size-choice" onclick="chooseSize('large')">
          <div class="size-sample" style="font-size:23px;line-height:1.5;" data-i18n="sizeSample"></div>
          <div class="size-tag" data-i18n="sizeLarge"></div>
        </button>
      </div>
      <button type="button" class="link-back" onclick="gotoStep(1)"><span class="material-icon" style="font-size:16px;">arrow_back</span><span data-i18n="sizeBack"></span></button>
    </div>
  </div>
</div>

<script src="emails.js"></script>
<script src="emails.en.js"></script>
<script>
// Le francais est la langue par defaut ; l'anglais n'est servi que si le
// joueur l'a choisi et que le jeu de donnees anglais est disponible.
const LEVELS = (getLang() === 'en' && typeof LEVELS_EN !== 'undefined') ? LEVELS_EN : LEVELS_FR;
// ---------- Progression ----------
let progress = {};
try{ progress = JSON.parse(localStorage.getItem('phish_progress') || '{}'); }catch(e){}

function starRow(n){
  let s = '';
  for(let i=1;i<=3;i++) s += i<=n ? '★' : '<span class="off">★</span>';
  return s;
}

let curFilter = 'all';
let curQuery = '';

function setFilter(f, el){
  curFilter = f;
  document.querySelectorAll('.nav-item.filter').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  renderLevels();
}
function onSearch(v){ curQuery = v.trim().toLowerCase(); renderLevels(); }

function renderLevels(){
  const list = document.getElementById('maillist');
  const doneCount = LEVELS.filter(l => (progress[l.id]||0) > 0).length;

  // filtre + recherche
  let levels = LEVELS.filter(lv => {
    const stars = progress[lv.id] || 0;
    if(curFilter === 'done' && stars === 0) return false;
    if(curFilter === 'todo' && stars > 0) return false;
    if(curQuery){
      const hay = (lv.name + ' ' + lv.subtitle + ' ' + lv.difficulty + ' niveau ' + lv.id).toLowerCase();
      if(!hay.includes(curQuery)) return false;
    }
    return true;
  });

  let html = '';
  // Ligne « tutoriel » : visible seulement en vue « Niveaux » sans recherche
  if(curFilter === 'all' && !curQuery){
    html += `
      <div class="mailrow unread" onclick="location.href='inbox.html?tuto=1'">
        <div class="m-cb"><input type="checkbox" onclick="event.stopPropagation()"></div>
        <div class="m-star"><span class="material-icon">star_border</span></div>
        <div class="m-sender">${t('navTutorial')}</div>
        <div class="m-body"><span class="m-label" style="background:#0b57d0;">${t('tutoBadge')}</span><span class="m-subject">${t('tutoSubject')}</span> <span class="m-snippet">${t('tutoSnippet')}</span></div>
      </div>`;
  }

  const EN = getLang() === 'en';
  const sectionLabel = curQuery ? (EN ? 'Results for \u201c' + curQuery + '\u201d' : 'Résultats pour « ' + curQuery + ' »')
                     : curFilter === 'done' ? (EN ? 'Completed levels' : 'Niveaux terminés')
                     : curFilter === 'todo' ? (EN ? 'Levels to do'     : 'Niveaux à faire')
                     : t('listSection');
  html += `<div class="list-section">${sectionLabel}</div>`;

  if(levels.length === 0){
    html += `<div style="padding:48px 20px;text-align:center;color:#5f6368;font-size:14px;">${t('listNone')}</div>`;
  }

  html += levels.map(lv => {
    const stars = progress[lv.id] || 0;
    const done = stars > 0;
    // état de l'étoile : gris (pas fait) / orange (réussi avec erreurs) / vert (parfait)
    const starClass = stars === 0 ? '' : (stars === 3 ? 'perfect' : 'ok');
    const starIcon = stars === 0 ? 'star_border' : 'star';
    const starTitle = stars === 0 ? (EN ? 'Not played yet' : 'Pas encore joué')
                    : (stars === 3 ? (EN ? 'Completed perfectly' : 'Réussi parfaitement')
                                   : (EN ? 'Completed with mistakes' : 'Réussi avec des erreurs'));
    return `
      <div class="mailrow ${done?'':'unread'}" onclick="location.href='inbox.html?level=${lv.id}'">
        <div class="m-cb"><input type="checkbox" onclick="event.stopPropagation()"></div>
        <div class="m-star ${starClass}" title="${starTitle}"><span class="material-icon">${starIcon}</span></div>
        <div class="m-sender">${t('levelWord')} ${lv.id}</div>
        <div class="m-body"><span class="m-label" style="background:${lv.accent};">${lv.difficulty}</span><span class="m-subject">${lv.name}.</span> <span class="m-snippet">${lv.subtitle}</span></div>
      </div>`;
  }).join('');


  list.innerHTML = html;
  document.getElementById('lvlCount').textContent = LEVELS.length;
  document.getElementById('doneCount').textContent = doneCount;
  const n = levels.length;
  document.getElementById('pager').innerHTML = (n ? '1&ndash;' + n : '0') + ' ' + t('of') + ' ' + LEVELS.length;
}

// ---------- Onboarding (identité + taille, cookies) ----------
let onboardAskSize = false;

function refreshGreeting(){
  const u = getUser();
  const greet = document.getElementById('greet');
  const av = document.getElementById('avatarTop');
  if(u){
    const t = userTokens(u);
    av.textContent = t.initiale;
    greet.innerHTML = t('greetHello') + ' <b>' + u.prenom + '</b> · ' + u.entreprise +
      ' <a onclick="showSizeTest()">' + t('greetTextSize') + '</a><a onclick="resetUser()">' + t('greetReset') + '</a>';
  } else {
    av.textContent = 'L';
    greet.innerHTML = '';
  }
}
function gotoStep(n){
  document.getElementById('step1').style.display = (n===1) ? 'block' : 'none';
  document.getElementById('step2').style.display = (n===2) ? 'block' : 'none';
}
function showOnboard(opts){
  opts = opts || {};
  onboardAskSize = !!opts.askSize;
  const u = getUser() || {};
  document.getElementById('f-prenom').value = u.prenom || '';
  document.getElementById('f-nom').value = u.nom || '';
  document.getElementById('f-entreprise').value = u.entreprise || '';
  gotoStep(1);
  document.getElementById('onboard').classList.add('show');
  document.getElementById('f-prenom').focus();
}
function showSizeTest(){
  onboardAskSize = false;
  gotoStep(2);
  document.getElementById('onboard').classList.add('show');
}
function finishOnboard(){
  document.getElementById('onboard').classList.remove('show');
  refreshGreeting();
}
function chooseSize(s){ setSize(s); finishOnboard(); }
function editUser(){ showOnboard({askSize:false}); }
function resetUser(){ clearUser(); refreshGreeting(); showOnboard({askSize:true}); }

document.getElementById('onboardForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  setUser({
    prenom: document.getElementById('f-prenom').value.trim(),
    nom: document.getElementById('f-nom').value.trim(),
    entreprise: document.getElementById('f-entreprise').value.trim()
  });
  if(onboardAskSize) gotoStep(2);
  else finishOnboard();
});

renderLevels();
if(!getUser()) showOnboard({askSize:true});
refreshGreeting();
</script>
<script>
// Tiroir de navigation (affichage mobile uniquement).
function toggleNav(force){
  const sb = document.getElementById('sidebar'), sc = document.getElementById('scrim');
  const open = (force === undefined) ? !sb.classList.contains('open') : force;
  sb.classList.toggle('open', open);
  sc.classList.toggle('show', open);
}
</script>
<script>applyI18n();</script>
